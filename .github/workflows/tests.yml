name: Heating Intelligence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m compileall -q custom_components tests
      - run: python -m unittest discover -s tests -v
      - run: docker run --rm --entrypoint python -v "${{ github.workspace }}:/src:ro" ghcr.io/home-assistant/home-assistant:2026.11.0 /src/tests/ha_smoke.py
